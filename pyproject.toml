[project]
name = "nfl-model"
version = "0.1.0"
description = "NFL fantasy projections from betting lines and usage, benchmarked against Sleeper"
authors = [
    { name = "Khang Nguyen", email = "khangnguyen518@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.8.0",
    "google-cloud-bigquery>=3.46.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-bigquery>=1.12.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
nflm = "nfl_model.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
